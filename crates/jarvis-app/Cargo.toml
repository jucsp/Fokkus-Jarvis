[package]
name = "jarvis-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Binario de Fokkus-Jarvis: orquesta núcleo, render, shell, audio e IPC."

[[bin]]
name = "fokkus-jarvis"
path = "src/main.rs"

[dependencies]
cpal.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
ringbuf.workspace = true
jarvis-audio = { path = "../jarvis-audio" }
jarvis-core = { path = "../jarvis-core" }
jarvis-ipc = { path = "../jarvis-ipc" }
jarvis-render = { path = "../jarvis-render" }
jarvis-shell = { path = "../jarvis-shell" }

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true
libc.workspace = true
