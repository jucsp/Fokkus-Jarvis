[package]
name = "jarvis-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Binario de Fokkus-Jarvis: orquesta núcleo, render, shell, audio e IPC."

[[bin]]
name = "fokkus-jarvis"
path = "src/main.rs"

[features]
# HU-75 fase 2: el daemon intenta sherpa-onnx (NeMo FastConformer CTC int8)
# antes que whisper. `--no-default-features` produce el binario sin
# sherpa-onnx, que es lo que necesita el empaquetado mientras la biblioteca
# nativa no esté vendorizada (SEC-01).
default = ["sherpa"]
sherpa = ["jarvis-audio/sherpa"]

[dependencies]
cpal.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
ringbuf.workspace = true
jarvis-audio = { path = "../jarvis-audio" }
jarvis-automation = { path = "../jarvis-automation" }
jarvis-core = { path = "../jarvis-core" }
jarvis-ipc = { path = "../jarvis-ipc" }
jarvis-render = { path = "../jarvis-render" }
jarvis-shell = { path = "../jarvis-shell" }

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true
libc.workspace = true
