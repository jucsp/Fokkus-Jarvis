# cargo-deny — gate de cadena de suministro de Fokkus-Jarvis (HU-0, SEC-05).
# Fuente: docs/specs/sdd-conversacion-nativa-v0.2.0.md §8.
# Se ejecuta en CI y en `make lint` / `make audit` con `cargo deny check`.

[graph]
# Plataformas soportadas: la aceptación funcional es Linux x86_64, pero Windows
# y macOS deben seguir compilando (§11), así que también se auditan.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
# Ningún advisory se ignora sin una justificación escrita junto al ID.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# La lista viene fijada por el contrato §8; no todas aparecen hoy en el árbol.
unused-allowed-license = "allow"
# Lista cerrada: cualquier licencia fuera de ella falla.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    # symphonia (SEC-09): copyleft débil por archivo; si se modifican sus
    # archivos, hay que publicar esos cambios.
    "MPL-2.0",
    # webpki-roots (raíces de Mozilla).
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Los crates del workspace llevan `publish = false` (licencia pendiente, D-1).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Las rutas locales del workspace y de vendor/ no cuentan como comodines.
allow-wildcard-paths = true
highlight = "all"
# §4: nada de tokio, reqwest, openssl, native-tls ni aws-lc en el árbol (SEC-03).
deny = [
    { crate = "openssl-sys", reason = "TLS único: rustls + ring (SEC-03)" },
    { crate = "openssl", reason = "TLS único: rustls + ring (SEC-03)" },
    { crate = "native-tls", reason = "TLS único: rustls + ring (SEC-03)" },
    { crate = "aws-lc-sys", reason = "Proveedor criptográfico único: ring (SEC-03)" },
    { crate = "aws-lc-rs", reason = "Proveedor criptográfico único: ring (SEC-03)" },
    { crate = "tokio", reason = "Política sin runtime async (§4)" },
    { crate = "reqwest", reason = "HTTP síncrono con ureq (§4)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Sin fuentes git: los parches de SEC-01 (whisper-rs-sys) y SEC-03 (msedge-tts)
# viven en vendor/ como rutas locales revisables en el propio repo.
allow-git = []
