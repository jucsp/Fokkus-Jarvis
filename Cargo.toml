[workspace]
resolver = "2"
members = [
    "crates/jarvis-core",
    "crates/jarvis-render",
    "crates/jarvis-shell",
    "crates/jarvis-app",
    "crates/jarvis-audio",
    "crates/jarvis-ipc",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.99"

[workspace.dependencies]
crossbeam-channel = "0.5"
# Renderizado CPU sin GPU. Se desactivan los features por defecto para no
# arrastrar la dependencia opcional `png` (y sus dependencias transitivas).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# Persistencia de configuración (aprobado por el PO el 2026-10-14).
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Serialización del protocolo JSON-RPC 2.0 sobre el socket local (Issue #5).
serde_json = "1"
# Superficie overlay real en Wayland (zwlr_layer_shell_v1) y bucle de eventos.
# Sin features por defecto: evita enlazar libxkbcommon (no se usa teclado aún).
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
# Apagado limpio con SIGINT/SIGTERM en el bucle principal.
signal-hook = "0.4"
