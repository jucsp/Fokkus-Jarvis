name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: fokkus-jarvis
  APP_DISPLAY_NAME: Fokkus-Jarvis
  APP_BUNDLE_ID: com.fokkus.jarvis
  APP_DESCRIPTION: Asistente de voz nativo de Fokkus con esfera líquida e integración IPC con Fokkus IDE.
  APP_MAINTAINER: Juan Carlos Saavedra <juanc.saavedra07@gmail.com>

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake clang libclang-dev pkg-config

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          # v0.1.2 -> 0.1.2 (nombre de los artefactos).
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          # deb/rpm no admiten '-' en la versión upstream: 0.1.2-rc1 -> 0.1.2~rc1.
          PKG_VERSION="${RELEASE_VERSION//-/\~}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Build release binary
        run: cargo build --release --locked --bin fokkus-jarvis --target ${{ matrix.target }}

      # ---------------------------------------------------------------- Linux
      - name: Package tar.gz (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="target/${{ matrix.target }}/release"
          tar -czf "dist/${APP_NAME}-${RELEASE_VERSION}-linux-x86_64.tar.gz" -C "$BIN_DIR" "$APP_NAME"

      - name: Package .deb (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${APP_NAME}"
          ROOT="pkg/deb"
          rm -rf "$ROOT"
          install -Dm755 "$BIN" "$ROOT/usr/bin/${APP_NAME}"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/share/applications"
          cat > "$ROOT/usr/share/applications/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_DISPLAY_NAME}
          Comment=${APP_DESCRIPTION}
          Exec=${APP_NAME}
          Terminal=false
          Categories=Utility;
          EOF
          sed -i 's/^[[:space:]]*//' "$ROOT/usr/share/applications/${APP_NAME}.desktop"
          INSTALLED_SIZE="$(du -sk "$ROOT/usr" | cut -f1)"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: ${APP_NAME}
          Version: ${PKG_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: ${APP_MAINTAINER}
          Description: ${APP_DESCRIPTION}
          EOF
          sed -i 's/^[[:space:]]*//' "$ROOT/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$ROOT" "dist/${APP_NAME}_${RELEASE_VERSION}_amd64.deb"
          dpkg-deb --info "dist/${APP_NAME}_${RELEASE_VERSION}_amd64.deb"

      - name: Package .rpm (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          TOPDIR="$PWD/pkg/rpmbuild"
          rm -rf "$TOPDIR"
          mkdir -p "$TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "target/${{ matrix.target }}/release/${APP_NAME}" "$TOPDIR/SOURCES/"
          cp "pkg/deb/usr/share/applications/${APP_NAME}.desktop" "$TOPDIR/SOURCES/"
          cat > "$TOPDIR/SPECS/${APP_NAME}.spec" <<EOF
          %global debug_package %{nil}
          %global __os_install_post %{nil}
          %define _build_id_links none

          Name:           ${APP_NAME}
          Version:        ${PKG_VERSION}
          Release:        1
          Summary:        ${APP_DESCRIPTION}
          License:        Proprietary
          BuildArch:      x86_64
          Source0:        ${APP_NAME}
          Source1:        ${APP_NAME}.desktop

          %description
          ${APP_DESCRIPTION}

          %install
          install -Dm755 %{SOURCE0} %{buildroot}%{_bindir}/${APP_NAME}
          install -Dm644 %{SOURCE1} %{buildroot}%{_datadir}/applications/${APP_NAME}.desktop

          %files
          %{_bindir}/${APP_NAME}
          %{_datadir}/applications/${APP_NAME}.desktop
          EOF
          sed -i 's/^[[:space:]]*//' "$TOPDIR/SPECS/${APP_NAME}.spec"
          rpmbuild --define "_topdir $TOPDIR" -bb "$TOPDIR/SPECS/${APP_NAME}.spec"
          RPM="$(find "$TOPDIR/RPMS" -name '*.rpm' | head -n1)"
          cp "$RPM" "dist/${APP_NAME}-${RELEASE_VERSION}-1.x86_64.rpm"
          rpm -qip "dist/${APP_NAME}-${RELEASE_VERSION}-1.x86_64.rpm"

      # -------------------------------------------------------------- Windows
      - name: Package .exe and .zip (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/$env:APP_NAME.exe"
          $base = "dist/$env:APP_NAME-$env:RELEASE_VERSION-windows-x86_64"
          Copy-Item $bin "$base.exe"
          Compress-Archive -Path $bin -DestinationPath "$base.zip" -Force

      # ---------------------------------------------------------------- macOS
      - name: Package .dmg (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          STAGING="pkg/dmg"
          APP="$STAGING/${APP_DISPLAY_NAME}.app"
          rm -rf "$STAGING"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          install -m755 "target/${{ matrix.target }}/release/${APP_NAME}" "$APP/Contents/MacOS/${APP_NAME}"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>${APP_DISPLAY_NAME}</string>
            <key>CFBundleDisplayName</key><string>${APP_DISPLAY_NAME}</string>
            <key>CFBundleIdentifier</key><string>${APP_BUNDLE_ID}</string>
            <key>CFBundleExecutable</key><string>${APP_NAME}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${RELEASE_VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${RELEASE_VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSMicrophoneUsageDescription</key><string>Fokkus-Jarvis usa el micrófono para recibir comandos de voz.</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "${APP_DISPLAY_NAME}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "dist/${APP_NAME}-${RELEASE_VERSION}-macos-arm64.dmg"

      # ------------------------------------------------------------ Checksums
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for file in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" > "${file}.sha256"
            else
              shasum -a 256 "$file" > "${file}.sha256"
            fi
          done
          ls -la

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
